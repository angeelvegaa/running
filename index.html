<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Running</title>
  <meta name="description" content="Seguimiento de entrenamiento de carrera" />

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />

  <!-- iOS: Safari ignora buena parte del manifest, necesita sus propias metas -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Running" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header class="app-header">
    <span class="app-title">Running</span>
  </header>

  <main id="view" class="view"></main>

  <nav class="bottom-nav">
    <button class="nav-btn" data-section="today">
      <span class="nav-icon">🏃</span>
      <span>Hoy</span>
    </button>
    <button class="nav-btn" data-section="history">
      <span class="nav-icon">📅</span>
      <span>Historial</span>
    </button>
    <button class="nav-btn" data-section="progress">
      <span class="nav-icon">📈</span>
      <span>Progreso</span>
    </button>
    <button class="nav-btn" data-section="zones">
      <span class="nav-icon">❤️</span>
      <span>Zonas</span>
    </button>
    <button class="nav-btn" data-section="settings">
      <span class="nav-icon">⚙️</span>
      <span>Ajustes</span>
    </button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
